# Kernel hardening — the portable parts of secureblue's profile.
# Deliberately excludes anything that masks services or breaks a desktop.

# Restrict kernel pointer and dmesg exposure
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Restrict eBPF and perf to root
kernel.unprivileged_bpf_disabled = 1
kernel.perf_event_paranoid = 3

# ptrace only on descendants (blocks process memory scraping between apps)
kernel.yama.ptrace_scope = 1

# Disable kexec — stops loading a replacement kernel at runtime
kernel.kexec_load_disabled = 1

# SysRq: keep only the "sync" and "remount read-only" bits
kernel.sysrq = 132

# Network: log martians, ignore redirects and source routing
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 2
# ^ Both lines are load-bearing, and the SECOND one exists to defeat stale
#   config in /etc that survives a rebase.
#
#   The kernel takes MAX(conf.all.rp_filter, conf.<iface>.rp_filter), so
#   `all` acts as a floor, not an override. Fedora's own default
#   (/usr/lib/sysctl.d/50-default.conf) is to leave `all` at 0 and set
#   `.*` and `default` to 2 — loose mode: drop only packets with no route
#   back at all, which is the part with real anti-spoofing value. Strict
#   mode (1) additionally drops asymmetric return paths, which breaks
#   policy-routed VPN traffic.
#
#   The live machine carries /etc/sysctl.d/91-net-hardening.conf setting
#   BOTH all and default to 1 (strict). A rebase does not reset /etc, so
#   that file persists into this image. 99- sorts after 91-, so `all=0`
#   above already wins — but `default` would otherwise be left at that
#   file's 1, and `default` is what every interface created after boot
#   inherits. That is exactly the VPN/tunnel case: wg/tun interfaces would
#   silently come up strict. Asserting 2 here closes that hole.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1

# Filesystem hardening
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ── Memory tuning ──────────────────────────────────────────────────────
# NOTE: vm.swappiness and vm.page-cluster are deliberately NOT set here.
# Fedora's zram-generator defaults (swappiness=100, page-cluster=0) are
# correct for compressed-RAM swap: there is no seek penalty, so swapping
# eagerly is nearly free and frees more memory for page cache. Lowering
# swappiness — the usual "optimisation" — makes things worse on zram.
#
# vfs_cache_pressure defaults to 100, which reclaims dentry/inode cache at
# the same rate as page cache. With 32 GB and a workload that touches large
# numbers of files (git trees, container layers, editors), keeping metadata
# cached longer is worth more than the pages it displaces.
vm.vfs_cache_pressure = 50
