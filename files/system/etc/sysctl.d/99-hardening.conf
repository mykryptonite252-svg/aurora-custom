# Kernel hardening — the portable parts of secureblue's profile.
# Deliberately excludes anything that masks services or breaks a desktop.

# Restrict kernel pointer and dmesg exposure
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Restrict eBPF and perf to root
kernel.unprivileged_bpf_disabled = 1
kernel.perf_event_paranoid = 3

# ptrace only on descendants (blocks process memory scraping between apps)
kernel.yama.ptrace_scope = 1

# Disable kexec — stops loading a replacement kernel at runtime
kernel.kexec_load_disabled = 1

# SysRq: keep only the "sync" and "remount read-only" bits
kernel.sysrq = 132

# Network: log martians, ignore redirects and source routing
net.ipv4.conf.all.rp_filter = 0
# ^ MUST stay 0: the router uses policy routing for the VPN, and strict
#   reverse-path filtering breaks asymmetric return paths.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1

# Filesystem hardening
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
