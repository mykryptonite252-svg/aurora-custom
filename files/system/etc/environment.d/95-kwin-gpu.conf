# Make KWin render on the NVIDIA GPU rather than the Intel iGPU.
#
# WHY: the 4K external display is physically wired to the NVIDIA GPU
# (card1-HDMI-A-3 -> 0000:01:00.0), but KWin defaulted to card0 (Intel) as its
# render device. Every frame was therefore rendered on the iGPU and copied
# across PCIe to the dGPU for scanout - roughly 2 GB/s at 3840x2160@60 - which
# is a classic source of stutter, dropped frames and added latency.
#
# This costs nothing in power: the dGPU cannot enter RTD3 runtime suspend while
# that monitor is attached, because it has to drive the output. It is already
# awake; it may as well do the rendering.
#
# Intel VAAPI (LIBVA_DRIVER_NAME=iHD) is a separate path and is unaffected -
# video decode/encode stays on the iGPU.
#
# Order matters: first device listed becomes primary.
# by-path is used rather than /dev/dri/card0|card1 because card numbering is
# not stable across boots.
KWIN_DRM_DEVICES=/dev/dri/by-path/pci-0000:01:00.0-card:/dev/dri/by-path/pci-0000:00:02.0-card
