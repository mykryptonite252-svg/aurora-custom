---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# Custom Aurora image — KDE, NVIDIA-open, hardened, dev tooling.
#
# Built from an audit of the live machine, so it reproduces what already works
# rather than guessing. Everything applied by hand over recent weeks is baked
# in here instead of accumulating as drift on top of the base.
#
# BASE CHOICE: aurora-dx-nvidia-open, deliberately NOT secureblue.
# The previous attempt used secureblue-hardened and three of its four commits
# were undoing damage it caused — it masks bluetooth.service, cups.service and
# avahi-daemon.service outright and conflicts with power-profiles-daemon. The
# hardening that matters is portable and is applied here; the parts that broke
# a working desktop are not.
#
# CPU DECISIONS (deliberate, not oversights):
#   * SMT / Hyper-Threading LEFT ENABLED. mds and mmio_stale_data report
#     "SMT vulnerable" on this silicon; closing that needs nosmt, which drops
#     12 threads to 6 for ~30-40% less multi-threaded throughput. Those attacks
#     require an attacker already executing code locally.
#   * ALL speculative-execution mitigations LEFT ENABLED. No mitigations=off.
#   * EPP is left to tuned, which already sets balance_performance. The live
#     system was found stuck on balance_power (balanced-battery's value) after
#     an AC transition — a stale-state bug. 60-tuned-ac-reapply.rules
#     re-asserts the profile rather than fighting tuned from a second service.
#   * hwp_dynamic_boost IS set (cpu-hwp-boost.service) — no tuned profile
#     manages it and it was found disabled.

name: aurora-custom
description: Aurora KDE + NVIDIA-open, hardened, with dev and container tooling

base-image: ghcr.io/ublue-os/aurora-dx-nvidia-open
image-version: stable

modules:
  # Sysctl hardening, kargs, udev rules, systemd units, VAAPI/KWin env.
  - type: files
    files:
      - source: system
        destination: /

  # ── Installs ────────────────────────────────────────────────────────
  - type: dnf
    repos:
      files:
        - https://packages.microsoft.com/yumrepos/vscode/config.repo
    install:
      packages:
        - code                # VS Code — was layered on the live system
        - clamav
        - clamtk              # GUI frontend for ClamAV
        - clamd
        - clamav-freshclam
        - rasdaemon           # ECC / hardware error reporting
        - nvtop
        - iotop
        # Previously layered on the live system — folded in so they survive
        # a rebase instead of being silently re-layered every time.
        - vorta               # Borg backup GUI
        - v4l-utils           # webcam controls (v4l2-ctl)
        - gnome-disk-utility
        - glibc-langpack-en
        - gparted             # partition editor — needs direct disk access,
                               # so native rather than Flatpak
        - android-tools       # adb + fastboot

  # ── Removals, split into labelled groups ────────────────────────────
  # Deliberately separate modules: a single 87-package transaction failed
  # with a bare "Rpm transaction failed" and no indication of the culprit.
  # Grouping means the next failure names the group it happened in.

  # Input methods — system is en_US only.
  - type: dnf
    remove:
      packages:
        - anthy-unicode
        - fcitx5
        - fcitx5-chewing
        - fcitx5-chinese-addons
        - fcitx5-chinese-addons-data
        - fcitx5-configtool
        - fcitx5-data
        - fcitx5-gtk
        - fcitx5-gtk3
        - fcitx5-gtk4
        - fcitx5-hangul
        - fcitx5-libs
        - fcitx5-libthai
        - fcitx5-lua
        - fcitx5-m17n
        - fcitx5-mozc
        - fcitx5-qt
        - fcitx5-qt5
        - fcitx5-qt6
        - fcitx5-qt-libfcitx5qt6widgets

  # Printing and scanning — removed entirely by choice. No printer is
  # attached; printing will not work until something is reinstalled.
  # NOTE: cups itself is NOT removed, only drivers and frontends.
  - type: dnf
    remove:
      packages:
        - bluez-cups
        - braille-printer-app
        - c2esp
        - dymo-cups-drivers
        - gutenprint
        - gutenprint-cups
        - hplip
        - hplip-common
        - hplip-libs
        - libsane-hpaio
        - plasma-print-manager
        - plasma-print-manager-libs
        - printer-driver-brlaser
        - ptouch-driver
        - sane-airscan
        - sane-backends
        - sane-backends-drivers-cameras
        - sane-backends-drivers-scanners
        - splix

  # Accessibility. brltty is removed for a second reason beyond being
  # unused: it claims USB serial adapters on hotplug and breaks them,
  # which matters on a machine used for serial console work on routers.
  #
  # brlapi is deliberately KEPT (unlike the other three): QEMU's braille
  # device passthrough feature hard-depends on it, so removing brlapi
  # cascades to libvirt-daemon-kvm and the entire qemu-system-* package set
  # (confirmed via dry-run: 27 packages instead of 1). brltty, orca and
  # python3-brlapi are each single-package, zero-cascade removals on their
  # own — dry-run confirmed exactly 3 packages combined, nothing else.
  - type: dnf
    remove:
      packages:
        - brltty
        - orca
        - python3-brlapi

  # Samba — the SERVER side, which can share local files on the LAN.
  #
  # Removed via a script, not the dnf module: samba-client's %postun
  # scriptlet exits 2 in the build container (RPM calls it "non-critical"
  # but the transaction aborts regardless), and the dnf module's `remove:`
  # only accepts `packages` and `auto-remove` — no way to skip scriptlets.
  #
  # samba-client-libs, samba-common and samba-core-libs/samba-ndr-libs are
  # deliberately KEPT — each is an 83-89 package cascade on its own (dry-run
  # confirmed), the same class of problem as avahi-libs above. The daemon,
  # CLI client, winbind, dcerpc, ldap modules and the Dolphin "share this
  # folder" integration are all still fully removed; only the shared
  # libraries other things link against for optional SMB support stay.
  # See files/scripts/remove-samba.sh for the exact list and the scriptlet
  # explanation.
  - type: script
    scripts:
      - remove-samba.sh

  # Network discovery, geolocation, online accounts.
  #
  # IMPORTANT — do not add avahi/geoclue2/kdsoap-ws-discovery-client back to
  # this removal list without re-running the dry-run checks below first.
  # This whole area turned out to be far more fragile than the earlier
  # kf6-baloo/kaccounts-integration-qt6 fix alone accounted for — that fix
  # was necessary but not sufficient, and this same 540+-package desktop
  # wipeout happened AGAIN on the next build even after it landed, because
  # the real root cause was here, not there:
  #
  #   dnf5 remove --assumeno avahi-libs          -> 555 packages
  #   dnf5 remove --assumeno avahi-glib          -> 344 packages
  #   dnf5 remove --assumeno geoclue2            -> 10 (incl. plasma-desktop,
  #                                                  plasma-workspace)
  #   dnf5 remove --assumeno kdsoap-ws-discovery-client -> 8 (same two)
  #   dnf5 remove --assumeno kaccounts-providers -> 2 (itself + kio-gdrive)
  #
  # avahi-libs and avahi-glib are shared libraries hundreds of unrelated
  # packages link against for optional zeroconf support — removing the
  # library, not just the daemon, breaks everything that merely links
  # against it even when the daemon was never running. geoclue2 and
  # kdsoap-ws-discovery-client turned out to be pulled in by
  # xdg-desktop-portal-kde and kio-extras respectively, which plasma-desktop
  # and plasma-workspace both require.
  #
  # Only kaccounts-providers is actually safe to remove here. Everything
  # else achieves the same privacy outcome — no broadcasting, no discovery,
  # no location lookups — by masking the actual services instead of
  # removing packages (see setup-container-gpu.sh). kdsoap-ws-discovery-client
  # has no service to mask; it's a passive library invoked only when
  # Dolphin's user browses "Network" by hand, not a background broadcaster,
  # so it's left installed and undisturbed.
  - type: dnf
    remove:
      packages:
        - kaccounts-providers

  # Baloo indexes the content of every readable file. Originally removed
  # for privacy and to stop the background I/O, but kf6-baloo is a hard
  # Requires of plasma-desktop/plasma-workspace — removing it cascades the
  # same way the avahi group did above. Keeping the packages installed and
  # disabling indexing via config instead: see baloo-disable.service. Same
  # practical outcome (no indexing, no background I/O) without breaking the
  # desktop.

  # Legacy hardware support, network filesystems, dead weight.
  #
  # Removed via script, not the dnf module: cifs-utils' %preun scriptlet
  # fails the same way samba-client's did (references live-system rpm
  # state that doesn't exist during a build).
  #
  # kdegraphics-mobipocket is deliberately KEPT — dry-run showed it cascades
  # to dolphin, kf6-baloo, and plasma-desktop/plasma-workspace (20 packages
  # instead of 1), the same fragility class as everything else fixed in
  # this pass. Every other package in this group is a confirmed
  # zero-cascade single-package removal. See files/scripts/remove-legacy.sh.
  - type: script
    scripts:
      - remove-legacy.sh

  # ── Service enablement ──────────────────────────────────────────────
  - type: script
    scripts:
      - setup-container-gpu.sh

  # ── Native browsers ──────────────────────────────────────────────────
  # Brave and Firefox layered as native dnf5-installed packages, not Flatpaks.
  # Chromium-family browsers have documented WebRTC hardware video ENCODE
  # degradation under Flatpak's sandbox; Phoenix's own support table marks
  # Flatpak Firefox as broken outright. Hardware-accelerated video calls
  # are a hard requirement, so both ship native instead. Zero browsers in
  # the Flatpak list above by the same reasoning.
  - type: containerfile
    containerfiles:
      - brave
      - firefox

  # ── Flatpaks ────────────────────────────────────────────────────────
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # Browsers
          # Brave, Firefox and Chrome all deliberately NOT shipped. Image is
          # browserless on first boot by choice — use Bazaar to install
          # whatever is chosen next.
          # Security / privacy
          # KeePassXC -> Keyguard: KeePassXC's vault (a single .kdbx binary
          # blob) had repeated corruption. Keyguard stores each entry
          # separately and is designed to run fully local with no account
          # required, unlike Bitwarden which nudges toward one.
          - com.artemchep.keyguard
          - org.cryptomator.Cryptomator
          - io.ente.auth
          - com.github.tchx84.Flatseal
          # Comms
          - us.zoom.Zoom
          - com.discordapp.Discord
          - com.tutanota.Tutanota
          - it.belloworld.mercurygram
          # System / utilities
          - io.missioncenter.MissionCenter
          - io.podman_desktop.PodmanDesktop
          - com.ranfdev.DistroShelf
          # Warehouse dropped — it manages already-installed Flatpaks
          # (permissions, cleanup), which Flatseal already covers for
          # permissions and `flatpak uninstall --unused` covers for cleanup.
          # Bazaar is the one kept: it is actually an app store (browse and
          # install from Flathub), a different job than Warehouse did.
          - io.github.kolunmi.Bazaar
          - com.github.qarmin.czkawka
          # Media / docs / hardware
          # mpc-qt -> Haruna: KDE-native player (real menu bar/toolbar,
          # built for Plasma) rather than mpc-qt's minimal interface.
          # Still mpv underneath, same playback engine/quality.
          - org.kde.haruna
          # OnlyOffice -> LibreOffice: OnlyOffice's desktop app is
          # Chromium/Electron-based, the same category of overhead as
          # VS Code — that's the actual source of the slowness/weight.
          # LibreOffice is native, lighter at startup and idle. Trade-off:
          # format fidelity on complex Word/Excel docs isn't always as
          # exact as OnlyOffice's, which optimises specifically for that.
          - org.libreoffice.LibreOffice
          - hu.irl.cameractrls
      - scope: user

  - type: signing
