---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# Custom Aurora image — KDE, NVIDIA-open, hardened, dev tooling.
#
# Built from an audit of the live system, so it reproduces what already works.
# Everything applied by hand over recent weeks is baked in here rather than
# left as drift on top of the base.
#
# Base choice: aurora-dx-nvidia-open, deliberately NOT secureblue.
# The previous attempt used secureblue-hardened, and three of its four commits
# were undoing damage it caused — it masks bluetooth.service, cups.service and
# avahi-daemon.service outright and conflicts with power-profiles-daemon.
# The hardening that actually matters is portable and is applied below; the
# parts that broke a working desktop are not.

name: aurora-custom
description: Aurora KDE + NVIDIA-open, hardened, with dev and container tooling

base-image: ghcr.io/ublue-os/aurora-dx-nvidia-open
image-version: stable

# CPU DECISIONS (recorded deliberately, not oversights):
#
#   * SMT / Hyper-Threading: LEFT ENABLED. The mds and mmio_stale_data
#     mitigations report "SMT vulnerable" on this silicon. Closing that fully
#     requires nosmt, which drops 12 threads to 6 for roughly 30-40% less
#     multi-threaded throughput. Those attacks require an attacker already
#     executing code locally, so the trade was judged not worth it.
#
#   * Speculative-execution mitigations: ALL LEFT ENABLED. No mitigations=off,
#     no per-flag disabling. This is the single most common "performance tip"
#     and it is a bad trade here.
#
#   * EPP is left to tuned, which already sets balance_performance in its
#     "balanced" profile. The live system was found stuck on balance_power
#     (balanced-battery's value) after an AC transition — a stale-state bug,
#     not a misconfiguration. 60-tuned-ac-reapply.rules re-asserts the profile
#     on power-supply changes rather than fighting tuned from a second service.
#
#   * hwp_dynamic_boost IS set (cpu-hwp-boost.service) — no tuned profile on
#     this system manages it and it was found disabled.

modules:
  # Drop in sysctl hardening, the CDI GPU service and Brave flags.
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - https://packages.microsoft.com/yumrepos/vscode/config.repo
    install:
      packages:
        - code                # VS Code — was layered on the live system
        - clamav
        - clamtk        # GUI frontend for ClamAV
        - clamd
        - clamav-freshclam
        - rasdaemon      # ECC / hardware error reporting
        - nvtop
        - iotop
        # Previously layered on the live system — folded in so they survive
        # the rebase instead of having to be re-layered every time.
        - vorta               # Borg backup GUI — was layered
        - v4l-utils           # webcam controls (v4l2-ctl) — was layered
        - gnome-disk-utility  # was layered
        - glibc-langpack-en   # was layered
    remove:
      packages:
        # ── Input methods / i18n (system is en_US only) ──────────────
        - anthy-unicode
        - fcitx5
        - fcitx5-chewing
        - fcitx5-chinese-addons
        - fcitx5-chinese-addons-data
        - fcitx5-configtool
        - fcitx5-data
        - fcitx5-gtk
        - fcitx5-gtk3
        - fcitx5-gtk4
        - fcitx5-hangul
        - fcitx5-libs
        - fcitx5-libthai
        - fcitx5-lua
        - fcitx5-m17n
        - fcitx5-mozc
        - fcitx5-qt
        - fcitx5-qt5
        - fcitx5-qt6
        - fcitx5-qt-libfcitx5qt6widgets
        # ── Printing & scanning (removed entirely, by choice) ─────────
        # Printing will not work until something is reinstalled. This is
        # deliberate: no printer is attached to this machine.
        - bluez-cups
        - braille-printer-app
        - c2esp
        - dymo-cups-drivers
        - gutenprint
        - gutenprint-cups
        - hplip
        - hplip-common
        - hplip-libs
        - libsane-hpaio
        - plasma-print-manager
        - plasma-print-manager-libs
        - printer-driver-brlaser
        - ptouch-driver
        - sane-airscan
        - sane-backends
        - sane-backends-drivers-cameras
        - sane-backends-drivers-scanners
        - splix
        # ── Accessibility ─────────────────────────────────────────────
        # brltty is removed for a second reason beyond being unused: it
        # claims USB serial adapters on hotplug and breaks them, which
        # matters on a machine used for serial console work on routers.
        - brlapi
        - brltty
        - orca
        - python3-brlapi
        # ── Legacy wireless firmware (hardware not present) ───────────
        - b43-fwcutter
        - b43-openfwwf
        # ── Network filesystems (not used) ────────────────────────────
        - autofs
        - davfs2
        - cifs-utils
        - cifs-utils-info
        - nfs-utils
        # ── Legacy document converters ────────────────────────────────
        - antiword
        - catdoc
        # ── Samba / SMB (server side too — closes LAN file sharing) ───
        - samba
        - samba-client
        - samba-client-libs
        - samba-common
        - samba-common-tools
        - samba-core-libs
        - samba-dcerpc
        - samba-ldb-ldap-modules
        - samba-libs
        - samba-ndr-libs
        - samba-usershares
        - samba-winbind
        - samba-winbind-clients
        - samba-winbind-modules
        - kdenetwork-filesharing
        # ── Network discovery (broadcasts this host, enumerates others) ─
        # Avahi was already denied to Brave over D-Bus by an earlier
        # hardening pass; removing the package entirely is the stronger
        # version of the same decision.
        - avahi
        - avahi-glib
        - avahi-gobject
        - avahi-libs
        - avahi-tools
        - kdsoap-ws-discovery-client
        # ── Geolocation (also already denied over D-Bus) ──────────────
        - geoclue2
        # ── Online account sign-in (Google/Nextcloud/etc) ─────────────
        - kaccounts-integration-qt6
        - kaccounts-providers
        # ── File content indexer ──────────────────────────────────────
        # Baloo indexes the content of every file it can read. Removed for
        # both privacy and background I/O. Cost: no KDE file-content
        # search — use locate/find or per-app search instead.
        - kf6-baloo
        - kf6-baloo-file
        - kf6-baloo-libs
        - baloo-widgets
        # ── Dead weight ───────────────────────────────────────────────
        - plasma-desktop-doc
        - kdegraphics-mobipocket
        - plasma-workspace-wallpapers


  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # Browsers
          - com.brave.Browser
          - com.google.Chrome
          - org.mozilla.firefox
          # Security / privacy
          - org.keepassxc.KeePassXC
          - org.cryptomator.Cryptomator
          - io.ente.auth
          - org.gnome.World.Secrets
          - com.github.tchx84.Flatseal
          # Comms
          - us.zoom.Zoom
          - com.discordapp.Discord
          - com.tutanota.Tutanota
          - it.belloworld.mercurygram
          # System / utilities
          - io.missioncenter.MissionCenter
          - io.podman_desktop.PodmanDesktop
          - com.ranfdev.DistroShelf
          - io.github.flattool.Warehouse
          - io.github.kolunmi.Bazaar
          - org.bleachbit.BleachBit
          - com.github.qarmin.czkawka
          - com.github.LongSoft.UEFITool
          # Media / docs / hardware
          - io.github.mpc_qt.mpc-qt
          - org.onlyoffice.desktopeditors
          - hu.irl.cameractrls
      - scope: user

  - type: signing
